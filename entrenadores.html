<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrenadores Importantes — Galar</title>
  <style>
    :root {
      --bg-app: #0f141c;
      --bg-surface: #171f2c;
      --bg-card: #1e293b;
      --bg-card-hover: #253349;
      --bg-input: #111827;
      --border: #2e3d54;
      --border-strong: #475569;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.14);
      --accent-2: #a78bfa;
      --accent-2-soft: rgba(167, 139, 250, 0.15);
      --gold: #fbbf24;
      --gold-soft: rgba(251, 191, 36, 0.14);
      --emerald: #34d399;
      --emerald-soft: rgba(52, 211, 153, 0.14);
      --radius-lg: 14px;
      --radius-md: 10px;
      --radius-sm: 7px;
      --shadow-modal: 0 24px 64px rgba(0, 0, 0, 0.65);

      --t-normal: #94a3b8;
      --t-fuego: #f97316;
      --t-agua: #38bdf8;
      --t-planta: #22c55e;
      --t-electrico: #eab308;
      --t-hielo: #67e8f9;
      --t-lucha: #ef4444;
      --t-veneno: #a855f7;
      --t-tierra: #d97706;
      --t-volador: #818cf8;
      --t-psiquico: #ec4899;
      --t-bicho: #84cc16;
      --t-roca: #b45309;
      --t-fantasma: #6366f1;
      --t-dragon: #7c3aed;
      --t-siniestro: #475569;
      --t-acero: #64748b;
      --t-hada: #f472b6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top right, #1b283d 0%, var(--bg-app) 55%);
      color: var(--text-main);
      min-height: 100vh;
      line-height: 1.45;
    }

    .app-shell {
      max-width: 1320px;
      margin: 0 auto;
      padding: 28px 20px 64px;
    }

    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px 24px;
      margin-bottom: 22px;
    }

    .brand-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
    }

    .brand h1 {
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 0 12px var(--accent);
    }

    .nav-link-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      background: var(--bg-card);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: var(--radius-sm);
      padding: 6px 12px;
      font-size: 0.82rem;
      font-weight: 600;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.12s ease;
    }

    .nav-link-btn:hover {
      background: var(--accent-soft);
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .brand p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 6px;
    }

    .stats-strip {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .stat-chip {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 8px 12px;
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .stat-chip strong { color: var(--text-main); font-weight: 600; }

    .selector-panel {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px 24px;
      margin-bottom: 24px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      align-items: end;
    }

    .control-group { display: flex; flex-direction: column; gap: 7px; }

    .control-group label {
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    select, input[type="search"] {
      width: 100%;
      background: var(--bg-input);
      color: var(--text-main);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      font-size: 0.93rem;
      outline: none;
    }

    select:focus, input[type="search"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .encounter-banner {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 22px 24px;
      margin-bottom: 22px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .encounter-title-wrap { display: flex; flex-direction: column; gap: 6px; }
    .badges-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.76rem;
      font-weight: 600;
    }

    .badge-cat { background: var(--accent-soft); color: var(--accent); border: 1px solid rgba(56, 189, 248, 0.28); }
    .badge-format { background: var(--accent-2-soft); color: var(--accent-2); border: 1px solid rgba(167, 139, 250, 0.28); }
    .badge-count { background: var(--emerald-soft); color: var(--emerald); border: 1px solid rgba(52, 211, 153, 0.28); }

    .encounter-name { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.015em; }

    .encounter-note {
      font-size: 0.85rem;
      color: var(--text-muted);
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      max-width: 520px;
    }

    .encounter-note span { color: var(--gold); font-weight: 600; margin-right: 4px; }

    .team-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 18px;
    }

    .poke-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      transition: transform 0.16s ease, border-color 0.16s ease, background 0.16s ease;
    }

    .poke-card:hover {
      transform: translateY(-2px);
      border-color: var(--border-strong);
      background: var(--bg-card-hover);
    }

    .poke-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }

    .poke-identity {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .poke-sprite {
      width: 54px;
      height: 54px;
      object-fit: contain;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 4px;
      flex-shrink: 0;
    }

    .poke-name-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 7px;
    }

    .poke-name { font-size: 1.12rem; font-weight: 700; color: var(--text-main); }

    .poke-types-row {
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 5px;
    }

    .poke-type-pill {
      --type-color: var(--t-normal);
      font-size: 0.66rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 2px 7px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--type-color) 24%, var(--bg-surface));
      border: 1px solid color-mix(in srgb, var(--type-color) 65%, transparent);
      color: #f8fafc;
      line-height: 1.2;
      white-space: nowrap;
    }

    .poke-level {
      background: var(--gold-soft);
      color: var(--gold);
      border: 1px solid rgba(251, 191, 36, 0.32);
      border-radius: var(--radius-sm);
      padding: 3px 9px;
      font-size: 0.82rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .meta-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      font-size: 0.84rem;
    }

    .meta-box {
      background: var(--bg-surface);
      border: 1px solid rgba(148, 163, 184, 0.14);
      border-radius: var(--radius-sm);
      padding: 8px 10px;
    }

    .meta-label {
      display: block;
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 2px;
    }

    .meta-value { font-weight: 600; color: var(--text-main); word-break: break-word; }
    .meta-value.muted { color: var(--text-muted); font-weight: 400; font-style: italic; }

    .interactive-trigger {
      cursor: pointer;
      border-style: dashed !important;
      border-color: rgba(56, 189, 248, 0.45) !important;
    }

    .interactive-trigger:hover {
      background: var(--accent-soft) !important;
      border-color: var(--accent) !important;
    }

    .interactive-trigger .meta-value { color: var(--accent); }

    .stats-box {
      background: var(--bg-surface);
      border: 1px solid rgba(148, 163, 184, 0.16);
      border-radius: var(--radius-md);
      padding: 10px 12px;
    }

    .stats-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    .stat-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 0.66rem;
      color: var(--text-muted);
    }

    .stat-legend-item {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .stat-legend-swatch {
      width: 8px;
      height: 8px;
      border-radius: 2px;
      display: inline-block;
    }

    .stats-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
    }

    .stats-table th {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      font-weight: 700;
      padding: 0 4px 6px;
      border-bottom: 1px solid var(--border);
      text-align: right;
    }

    .stats-table th:first-child { text-align: left; }
    .stats-table th.bar-col { text-align: left; padding-left: 8px; }

    .stats-table td {
      padding: 5px 4px;
      border-bottom: 1px solid rgba(46, 61, 84, 0.45);
      vertical-align: middle;
    }

    .stats-table tr:last-child td { border-bottom: none; }

    .stat-name {
      font-weight: 600;
      color: var(--text-muted);
      white-space: nowrap;
      width: 68px;
    }

    .stat-bar-cell { padding-left: 8px !important; width: 100%; }

    .stat-track {
      width: 100%;
      height: 7px;
      background: rgba(15, 20, 28, 0.85);
      border-radius: 999px;
      overflow: hidden;
    }

    .stat-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.2s ease;
    }

    .tier-low {
      background: linear-gradient(90deg, #dc2626, #ef4444);
      box-shadow: 0 0 6px rgba(239, 68, 68, 0.35);
    }
    .tier-mid-low {
      background: linear-gradient(90deg, #d97706, #eab308);
      box-shadow: 0 0 6px rgba(234, 179, 8, 0.35);
    }
    .tier-mid-high {
      background: linear-gradient(90deg, #16a34a, #22c55e);
      box-shadow: 0 0 6px rgba(34, 197, 94, 0.35);
    }
    .tier-high {
      background: linear-gradient(90deg, #0284c7, #38bdf8);
      box-shadow: 0 0 6px rgba(56, 189, 248, 0.35);
    }
    .tier-peak {
      background: linear-gradient(90deg, #7c3aed, #c084fc);
      box-shadow: 0 0 7px rgba(168, 85, 247, 0.4);
    }

    .stat-num {
      text-align: right;
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      min-width: 34px;
    }

    .stat-base.c-low { color: #f87171; }
    .stat-base.c-mid-low { color: #facc15; }
    .stat-base.c-mid-high { color: #4ade80; }
    .stat-base.c-high { color: #38bdf8; }
    .stat-base.c-peak { color: #c084fc; }

    .stat-iv { color: var(--text-muted); font-weight: 600; }
    .stat-ev { color: var(--emerald); }
    .stat-ev.zero { color: var(--text-muted); font-weight: 500; }

    .moves-section { display: flex; flex-direction: column; gap: 7px; }

    .moves-header {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    .moves-list { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }

    .move-btn {
      --type-color: var(--t-normal);
      background: color-mix(in srgb, var(--type-color) 16%, var(--bg-surface));
      border: 1px solid color-mix(in srgb, var(--type-color) 52%, transparent);
      border-left: 4px solid var(--type-color);
      border-radius: var(--radius-sm);
      padding: 7px 9px;
      color: var(--text-main);
      font-size: 0.82rem;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      transition: transform 0.12s ease, background 0.14s ease, border-color 0.14s ease;
    }

    .move-btn:hover {
      transform: translateY(-1px);
      background: color-mix(in srgb, var(--type-color) 28%, var(--bg-surface));
      border-color: var(--type-color);
    }

    .move-meta-right {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }

    .move-type-pill {
      font-size: 0.64rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      padding: 1px 5px;
      border-radius: 4px;
      background: color-mix(in srgb, var(--type-color) 26%, #0f172a);
      color: #f8fafc;
    }

    .move-arrow {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .type-normal { --type-color: var(--t-normal); }
    .type-fuego { --type-color: var(--t-fuego); }
    .type-agua { --type-color: var(--t-agua); }
    .type-planta { --type-color: var(--t-planta); }
    .type-electrico { --type-color: var(--t-electrico); }
    .type-hielo { --type-color: var(--t-hielo); }
    .type-lucha { --type-color: var(--t-lucha); }
    .type-veneno { --type-color: var(--t-veneno); }
    .type-tierra { --type-color: var(--t-tierra); }
    .type-volador { --type-color: var(--t-volador); }
    .type-psiquico { --type-color: var(--t-psiquico); }
    .type-bicho { --type-color: var(--t-bicho); }
    .type-roca { --type-color: var(--t-roca); }
    .type-fantasma { --type-color: var(--t-fantasma); }
    .type-dragon { --type-color: var(--t-dragon); }
    .type-siniestro { --type-color: var(--t-siniestro); }
    .type-acero { --type-color: var(--t-acero); }
    .type-hada { --type-color: var(--t-hada); }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(5, 8, 15, 0.78);
      backdrop-filter: blur(5px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal-backdrop.open { display: flex; }

    .modal-dialog {
      width: 100%;
      max-width: 540px;
      background: var(--bg-surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-modal);
      overflow: hidden;
    }

    .modal-head {
      padding: 18px 22px;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .modal-type-tag {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      margin-bottom: 5px;
      display: inline-block;
    }

    .modal-type-tag.move-tag { background: var(--accent-2-soft); color: var(--accent-2); }
    .modal-title { font-size: 1.2rem; font-weight: 700; }

    .modal-close {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      width: 34px;
      height: 34px;
      border-radius: 8px;
      font-size: 1.1rem;
      cursor: pointer;
    }

    .modal-body { padding: 20px 22px; display: flex; flex-direction: column; gap: 14px; }
    .modal-stats-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    @media (min-width: 480px) { .modal-stats-row.cols-4 { grid-template-columns: repeat(4, 1fr); } }

    .modal-stat {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
    }

    .modal-stat span { display: block; font-size: 0.7rem; text-transform: uppercase; color: var(--text-muted); }
    .modal-stat strong { font-size: 0.95rem; color: var(--text-main); }

    .modal-desc {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 13px 15px;
      font-size: 0.92rem;
    }

    .modal-footer {
      padding: 14px 22px;
      background: var(--bg-card);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .btn-primary {
      background: var(--accent);
      color: #08121e;
      border: none;
      border-radius: var(--radius-sm);
      padding: 8px 14px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-row">
          <h1><span class="brand-dot"></span>Entrenadores Importantes — Galar</h1>
          <a href="index.html" class="nav-link-btn">← Ir a la Pokédex</a>
        </div>
        <p>Estadísticas calculadas al nivel del Pokémon (con IVs y EVs sumados), tipos por ficha y movimientos por tipo.</p>
      </div>
      <div class="stats-strip" id="globalStats"></div>
    </header>

    <section class="selector-panel" aria-label="Selector de entrenadores">
      <div class="control-group">
        <label for="categoryFilter">Categoría</label>
        <select id="categoryFilter"></select>
      </div>
      <div class="control-group">
        <label for="searchFilter">Buscar entrenador o Pokémon</label>
        <input id="searchFilter" type="search" placeholder="Ej. Bea, Lionel, Charizard, Ruta 5..." />
      </div>
      <div class="control-group">
        <label for="trainerSelect">Entrenador / Combate</label>
        <select id="trainerSelect"></select>
      </div>
    </section>

    <section class="encounter-banner" id="encounterBanner"></section>
    <main class="team-grid" id="teamGrid" aria-live="polite"></main>
  </div>

  <div class="modal-backdrop" id="detailModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-dialog">
      <div class="modal-head">
        <div>
          <span class="modal-type-tag" id="modalKindTag">Habilidad</span>
          <h2 class="modal-title" id="modalTitle">—</h2>
        </div>
        <button class="modal-close" id="modalCloseBtn" aria-label="Cerrar ventana">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer">
        <span id="modalSourceHint">Consulta rápida de datos de combate</span>
        <button class="btn-primary" id="modalOkBtn">Cerrar</button>
      </div>
    </div>

    function parseLevel(levelVal) {
      if (typeof levelVal === "number" && Number.isFinite(levelVal)) return Math.max(1, Math.floor(levelVal));
      if (!levelVal) return 50;
      const match = String(levelVal).match(/\d+/);
      return match ? Math.max(1, parseInt(match[0], 10)) : 50;
    }

    function calculateLevelStat(statKey, baseVal, ivVal, evVal, level, natureName) {
      if (!baseVal) return 0;
      const evBonus = Math.floor(evVal / 4);
      if (statKey === "hp") {
        if (baseVal === 1) return 1;
        return Math.floor(((2 * baseVal + ivVal + evBonus) * level) / 100) + level + 10;
      }
      const raw = Math.floor(((2 * baseVal + ivVal + evBonus) * level) / 100) + 5;
      const mod = NATURE_MODIFIERS[natureName]?.[statKey] ?? 1.0;
      return Math.floor(raw * mod);
    }

    function getStatColorTier(val) {
      if (val < 50) return { barClass: "tier-low", numClass: "c-low" };
      if (val < 90) return { barClass: "tier-mid-low", numClass: "c-mid-low" };
      if (val < 120) return { barClass: "tier-mid-high", numClass: "c-mid-high" };
      if (val < 150) return { barClass: "tier-high", numClass: "c-high" };
      return { barClass: "tier-peak", numClass: "c-peak" };
    }

    function parseEvs(evStr) {
      const result = { hp: 0, atk: 0, def: 0, spa: 0, spd: 0, spe: 0 };
      if (!evStr || evStr.trim().toLowerCase() === "(none)") return result;
      for (const rawPart of evStr.split("/")) {
        const part = rawPart.trim().toLowerCase();
        if (!part) continue;
        const numMatch = part.match(/\d+/);
        if (!numMatch) continue;
        const val = parseInt(numMatch[0], 10);
        const label = part.replace(numMatch[0], "").trim();
        if (label.includes("ps") || label.includes("hp")) result.hp += val;
        else if (label.includes("at. esp") || label.includes("spa") || label.includes("sp. atk")) result.spa += val;
        else if (label.includes("def. esp") || label.includes("spd") || label.includes("sp. def")) result.spd += val;
        else if (label.includes("ataque") || label.includes("atk")) result.atk += val;
        else if (label.includes("defensa") || label.includes("def")) result.def += val;
        else if (label.includes("vel") || label.includes("spe")) result.spe += val;
      }
      return result;
    }

    function applyFilters() {
      const cat = categoryFilter.value;
      const q = searchFilter.value.trim().toLowerCase();

      filteredEncounters = TRAINERS_DATA.filter(enc => {
        const matchesCat = cat === "ALL" || enc.category === cat;
        if (!matchesCat) return false;
        if (!q) return true;
        return (
          enc.name.toLowerCase().includes(q) ||
          enc.category.toLowerCase().includes(q) ||
          enc.team.some(p =>
            p.pokemon.toLowerCase().includes(q) ||
            (POKEMON_TYPES[p.pokemon] || []).some(t => t.toLowerCase().includes(q)) ||
            (p.ability || "").toLowerCase().includes(q) ||
            (p.moves || []).some(m => m.toLowerCase().includes(q))

        );

      populateTrainerDropdown();

      if (filteredEncounters.length > 0) {
        if (!filteredEncounters.some(e => e.id === currentEncounterId)) {

    function populateTrainerDropdown() {

      filteredEncounters.forEach(enc => {
        if (!grouped[enc.category]) grouped[enc.category] = [];
        grouped[enc.category].push(enc);
      });

      Object.entries(grouped).forEach(([cat, items]) => {

        });

          const eVal = evs[row.key] ?? 0;
          const finalVal = calculateLevelStat(row.key, bVal, iVal, eVal, levelNum, p.nature);
          return { ...row, bVal, iVal, eVal, finalVal };
        });

        const maxCalcVal = Math.max(100, ...calculatedStats.map(s => s.finalVal));

        const statRowsHtml = calculatedStats.map(st => {
          const pct = Math.min(100, Math.max(6, Math.round((st.finalVal / maxCalcVal) * 100)));
          const tier = getStatColorTier(st.bVal);
          return `

    function getMoveMeta(moveName) {
      if (MOVE_METADATA[moveName]) return MOVE_METADATA[moveName];
      const lower = String(moveName).toLowerCase();
      const foundKey = Object.keys(MOVE_METADATA).find(k => k.toLowerCase() === lower);
      return foundKey ? MOVE_METADATA[foundKey] : null;
    }

      const type = meta ? meta[0] : (moveType || "Normal");
      const category = meta ? meta[1] : "—";
      const power = meta ? meta[2] : "—";
      const accuracy = meta ? meta[3] : "—";
      const pp = meta ? meta[4] : "—";
      const desc = meta ? meta[5] : `Movimiento ${moveName} de tipo ${type}.`;

      modalKindTag.textContent = `Movimiento · ${type} · ${category}`;
      modalKindTag.className = "modal-type-tag move-tag";
      modalTitle.textContent = moveName;
      modalSourceHint.textContent = `Usuario: ${pokemonName}`;
      modalBody.innerHTML = `
        <div class="modal-stats-row cols-4">
          <div class="modal-stat"><span>Tipo</span><strong>${escapeHtml(type)}</strong></div>
          <div class="modal-stat"><span>Categoría</span><strong>${escapeHtml(category)}</strong></div>
          <div class="modal-stat"><span>Potencia</span><strong>${escapeHtml(power)}</strong></div>
          <div class="modal-stat"><span>Precisión · PP</span><strong>${escapeHtml(accuracy)} · ${escapeHtml(pp)}</strong></div>
        </div>
        <div class="modal-desc">
          <div style="font-size:0.72rem;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-muted);margin-bottom:6px;font-weight:700;">Efecto y detalles</div>
          <div>${escapeHtml(desc)}</div>
        </div>
      `;
      showModal();
    }

    function showModal() {
      modal.classList.add("open");
      modalOkBtn.focus();
    }

    function closeModal() {
      modal.classList.remove("open");
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function escapeAttr(str) {
      return escapeHtml(str).replace(/'/g, "&#39;");
    }

    categoryFilter.addEventListener("change", applyFilters);
    searchFilter.addEventListener("input", applyFilters);
    trainerSelect.addEventListener("change", e => {
      currentEncounterId = e.target.value;
      const found = filteredEncounters.find(item => item.id === currentEncounterId);
      renderEncounter(found);
    });

    modalCloseBtn.addEventListener("click", closeModal);
    modalOkBtn.addEventListener("click", closeModal);
    modal.addEventListener("click", e => { if (e.target === modal) closeModal(); });
    document.addEventListener("keydown", e => {
      if (e.key === "Escape" && modal.classList.contains("open")) closeModal();
    });

    async function loadTrainersJson() {
      for (const file of ["trainers_data_v2.json", "trainers_data_2_2.json"]) {
        try {
          const res = await fetch(file);
          if (res.ok) {
            const parsed = await res.json();
            const list = Array.isArray(parsed) ? parsed : (parsed.trainers || parsed.encounters || []);
            if (list.length > 0) {
              TRAINERS_DATA = list;
              currentEncounterId = TRAINERS_DATA[0].id;
              return;
            }
          }
        } catch {}
      }
    }

    async function init() {
      await loadTrainersJson();
      initCategories();
      renderGlobalStats();
      applyFilters();
    }

    init();
  </script>
</body>
</html>
