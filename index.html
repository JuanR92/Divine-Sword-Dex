<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Divine Sword Pokédex</title>
  <style>
    :root {
      --bg-main: #0f1117;
      --bg-sidebar: #161922;
      --bg-card: #1c202b;
      --bg-card-alt: #232836;
      --border: #2d3343;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.14);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-main);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* SIDEBAR */
    .sidebar {
      width: 340px;
      min-width: 300px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    .sidebar-header { padding: 16px; border-bottom: 1px solid var(--border); background: #12151d; }
    .brand { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .brand h1 { font-size: 1.05rem; font-weight: 800; color: #fff; }
    .brand span {
      font-size: 0.72rem; background: var(--accent-soft); color: var(--accent);
      padding: 2px 8px; border-radius: 999px; font-weight: 700;
    }
    .search-box, .filter-select {
      width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--bg-card); color: var(--text-main); font-size: 0.85rem; margin-bottom: 8px; outline: none;
    }
    .filters-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .results-meta {
      padding: 7px 16px; font-size: 0.75rem; color: var(--text-muted);
      border-bottom: 1px solid var(--border); display: flex; justify-content: space-between;
    }
    .pokemon-list { flex: 1; overflow-y: auto; }
    .poke-item {
      display: flex; align-items: center; gap: 10px; padding: 10px 14px;
      border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.15s;
    }
    .poke-item:hover { background: var(--bg-card-alt); }
    .poke-item.active { background: var(--accent-soft); border-left: 3px solid var(--accent); }
    .poke-item img { width: 42px; height: 42px; object-fit: contain; }
    .poke-item-info { flex: 1; min-width: 0; }
    .poke-item-top { display: flex; gap: 6px; align-items: baseline; }
    .poke-num { font-size: 0.75rem; color: var(--text-muted); }
    .poke-name { font-weight: 700; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .poke-item-types { display: flex; gap: 4px; margin-top: 4px; }
    .mini-badge { font-size: 0.68rem; padding: 1px 6px; border-radius: 5px; color: #fff; font-weight: 600; }
    .poke-bst-pill { font-size: 0.72rem; color: var(--accent); font-weight: 700; }

    /* MAIN */
    .main { flex: 1; overflow-y: auto; padding: 24px; }
    .container { max-width: 1060px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
    .top-nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    .top-nav-group { display: flex; gap: 8px; align-items: center; }
    .nav-btn {
      background: var(--bg-card); color: var(--text-main); border: 1px solid var(--border);
      padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 600;
      text-decoration: none; display: inline-flex; align-items: center; gap: 6px; font-size: 0.88rem;
      transition: border-color 0.15s, background 0.15s, transform 0.12s;
    }
    .nav-btn:hover { border-color: var(--accent); transform: translateY(-1px); }
    .nav-btn-trainers {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: rgba(56, 189, 248, 0.45);
      font-weight: 700;
    }
    .nav-btn-trainers:hover {
      background: rgba(56, 189, 248, 0.24);
      border-color: var(--accent);
    }

    .hero-card, .card {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 20px;
    }
    .hero-card { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
    .sprite-box img { width: 140px; height: 140px; object-fit: contain; }
    .hero-title { font-size: 1.85rem; margin: 4px 0 8px; }
    .type-row { display: flex; gap: 8px; margin-bottom: 14px; }
    .type-badge { padding: 4px 12px; border-radius: 999px; color: #fff; font-weight: 700; font-size: 0.85rem; }

    /* HABILIDADES CLICABLES */
    .abilities-box { display: flex; flex-wrap: wrap; gap: 8px; }
    .ability-btn {
      background: var(--bg-card-alt); color: var(--text-main); padding: 7px 12px;
      border-radius: 8px; font-size: 0.84rem; border: 1px solid var(--border);
      cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: 0.15s;
    }
    .ability-btn:hover, .ability-btn.selected {
      border-color: var(--accent); background: var(--accent-soft);
    }
    .ability-desc-panel {
      margin-top: 12px; padding: 12px 14px; border-radius: 10px;
      background: #141821; border-left: 3px solid var(--accent);
      font-size: 0.88rem; line-height: 1.45; display: none;
    }
    .ability-desc-panel.visible { display: block; }

    .two-col { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 18px; }
    .card-title { font-weight: 700; margin-bottom: 12px; display: flex; justify-content: space-between; color: var(--accent); }
    .stat-row { display: grid; grid-template-columns: 80px 42px 1fr; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 0.85rem; }
    .stat-track { height: 8px; background: var(--bg-card-alt); border-radius: 999px; overflow: hidden; }
    .stat-fill { height: 100%; border-radius: 999px; }
    .bst-footer { display: flex; justify-content: space-between; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); font-weight: 700; }

    .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .info-cell { background: var(--bg-card-alt); padding: 10px; border-radius: 8px; border: 1px solid var(--border); }
    .info-cell span { display: block; font-size: 0.72rem; color: var(--text-muted); }

    /* EVOLUCIONES CLICABLES */
    .evo-list { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
    .evo-card-btn {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--bg-card-alt); padding: 10px 14px; border-radius: 10px;
      border: 1px solid var(--border); color: var(--text-main); cursor: pointer;
      text-align: left; transition: 0.15s;
    }
    .evo-card-btn:hover { border-color: var(--accent); background: var(--accent-soft); }
    .evo-target-name { font-weight: 700; color: var(--accent); font-size: 0.95rem; }
    .evo-cond { font-size: 0.8rem; color: var(--text-muted); }

    /* SECCIONES DE MOVIMIENTOS */
    .tabs-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
    .tab-btn {
      background: var(--bg-card-alt); color: var(--text-muted); border: 1px solid var(--border);
      padding: 8px 14px; border-radius: 8px; font-size: 0.84rem; font-weight: 700; cursor: pointer;
    }
    .tab-btn.active { background: var(--accent); color: #0f1117; border-color: var(--accent); }

    .moves-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    .moves-table th {
      text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border);
      color: var(--text-muted); font-size: 0.76rem; text-transform: uppercase;
    }
    .moves-table td { padding: 10px 8px; border-bottom: 1px solid rgba(45, 51, 67, 0.5); vertical-align: middle; }
    .moves-table tr:hover td { background: rgba(255, 255, 255, 0.02); }
    .lvl-tag {
      display: inline-block; padding: 2px 8px; border-radius: 6px;
      background: var(--bg-card-alt); border: 1px solid var(--border); font-weight: 700; font-size: 0.78rem;
    }
    .cat-pill {
      display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 0.74rem; font-weight: 700; color: #fff;
    }
    .cat-physical { background: #c2410c; }
    .cat-special { background: #1d4ed8; }
    .cat-status { background: #475569; }
    .move-desc-cell { color: var(--text-muted); font-size: 0.8rem; max-width: 360px; line-height: 1.35; }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="brand">
        <h1>Divine Sword Pokédex</h1>
        <span id="totalBadge">0</span>
      </div>
      <input id="searchInput" class="search-box" type="text" placeholder="Buscar Pokémon, #ID o habilidad..." />
      <div class="filters-grid">
        <select id="typeFilter" class="filter-select">
          <option value="">Todos los tipos</option>
        </select>
        <select id="sortSelect" class="filter-select">
          <option value="id">Orden: N.º ID</option>
          <option value="bst">Orden: Total Stats</option>
          <option value="hp">Orden: HP</option>
          <option value="attack">Orden: Ataque</option>
          <option value="speed">Orden: Velocidad</option>
        </select>
      </div>
    </div>
    <div class="results-meta">
      <span id="resultsCount">0 mostrados</span>
      <span>← / → navegar</span>
    </div>
    <div class="pokemon-list" id="pokemonList"></div>
  </aside>

  <main class="main">
    <div class="container" id="detailContainer">
      <p style="color: var(--text-muted);">Cargando Pokédex...</p>
    </div>
  </main>

  <script>
    const TYPE_MAP_ES = {
      'Grass': 'Planta', 'Poison': 'Veneno', 'Fire': 'Fuego', 'Water': 'Agua',
      'Electric': 'Eléctrico', 'Normal': 'Normal', 'Ice': 'Hielo', 'Fighting': 'Lucha',
      'Ground': 'Tierra', 'Flying': 'Volador', 'Psychic': 'Psíquico', 'Bug': 'Bicho',
      'Rock': 'Roca', 'Ghost': 'Fantasma', 'Dragon': 'Dragón', 'Dark': 'Siniestro',
      'Steel': 'Acero', 'Fairy': 'Hada'
    };

    const TYPE_COLORS = {
      'Normal': '#9FA19F', 'Fuego': '#E62829', 'Agua': '#2980EF', 'Eléctrico': '#FAC000',
      'Planta': '#3FA129', 'Hielo': '#3DCEF3', 'Lucha': '#FF8000', 'Veneno': '#9141CB',
      'Tierra': '#915121', 'Volador': '#81B9EF', 'Psíquico': '#EF4179', 'Bicho': '#91A119',
      'Roca': '#AFA981', 'Fantasma': '#704170', 'Dragón': '#5060E1', 'Siniestro': '#624D4E',
      'Acero': '#60A1B8', 'Hada': '#EF70EF'
    };

    const moveDetailsCache = {};
    const abilityDetailsCache = {};

    let allPokemon = [];
    let filteredPokemon = [];
    let selectedId = '001';
    let activeMoveTab = 'level';

    function slugifyApi(name) {
      return name.toLowerCase()
        .replace(/['’]/g, '')
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-|-$/g, '');
    }

    async function fetchAbilityDescription(abilityRaw) {
      const cleanName = abilityRaw.replace(/\s*\([^)]+\)\s*$/, '').trim();
      if (abilityDetailsCache[cleanName]) return abilityDetailsCache[cleanName];

      try {
        const slug = slugifyApi(cleanName);
        const res = await fetch(`https://pokeapi.co/api/v2/ability/${slug}`);
        if (!res.ok) throw new Error('No encontrada');
        const data = await res.json();

        const esEntry = data.flavor_text_entries.find(e => e.language.name === 'es');
        const enEffect = data.effect_entries.find(e => e.language.name === 'en');
        const esName = (data.names.find(n => n.language.name === 'es') || {}).name || cleanName;

        const desc = esEntry
          ? esEntry.flavor_text.replace(/\s+/g, ' ')
          : (enEffect ? enEffect.short_effect : 'Sin descripción disponible.');

        const result = { name: `${esName} (${cleanName})`, desc };
        abilityDetailsCache[cleanName] = result;
        return result;
      } catch {
        return { name: cleanName, desc: 'No se pudo cargar la descripción de esta habilidad.' };
      }
    }

    async function fetchMoveDetails(moveName) {
      if (moveDetailsCache[moveName]) return moveDetailsCache[moveName];

      try {
        const slug = slugifyApi(moveName);
        const res = await fetch(`https://pokeapi.co/api/v2/move/${slug}`);
        if (!res.ok) throw new Error('No encontrado');
        const data = await res.json();

        const typeEs = TYPE_MAP_ES[data.type.name.charAt(0).toUpperCase() + data.type.name.slice(1)] || 'Normal';
        const dmgClass = data.damage_class ? data.damage_class.name : 'status';
        const esFlavor = data.flavor_text_entries.find(e => e.language.name === 'es');
        const enEffect = data.effect_entries.find(e => e.language.name === 'en');

        let desc = esFlavor
          ? esFlavor.flavor_text.replace(/\s+/g, ' ')
          : (enEffect ? enEffect.short_effect.replace(/\$effect_chance/g, data.effect_chance ?? '') : '—');

        const info = {
          type: typeEs,
          category: dmgClass,
          power: data.power ?? '—',
          accuracy: data.accuracy ? `${data.accuracy}%` : '—',
          pp: data.pp ?? '—',
          desc
        };
        moveDetailsCache[moveName] = info;
        return info;
      } catch {
        const fallback = { type: 'Normal', category: 'status', power: '—', accuracy: '—', pp: '—', desc: 'Sin datos adicionales.' };
        moveDetailsCache[moveName] = fallback;
        return fallback;
      }
    }

    function normalizeEntry(raw) {
      const idStr = String(raw.id).padStart(3, '0');
      const types = (raw.types || []).map(t => TYPE_MAP_ES[t] || t);
      const st = raw.stats || {};
      const statsArray = [
        st.hp ?? 0, st.attack ?? 0, st.defense ?? 0,
        st.sp_atk ?? st.sp_attack ?? 0, st.sp_def ?? st.sp_defense ?? 0, st.speed ?? 0
      ];
      return {
        id: idStr,
        name: raw.name || 'Desconocido',
        nameEs: raw.nameEs || null,
        t1: types[0] || 'Normal',
        t2: types[1] || null,
        stats: statsArray,
        bst: statsArray.reduce((a, b) => a + b, 0),
        abilities: raw.abilities || '',
        height: raw.height || '—',
        weight: raw.weight || '—',
        color: raw.color || '—',
        evos: Array.isArray(raw.evos) ? raw.evos : [],
        moves: raw.moves || { level: [], egg: [], tm: [], tr: [], tutor: [] }
      };
    }

    function getStatColor(v) {
      if (v < 50) return '#F34444';
      if (v < 70) return '#FF8C1A';
      if (v < 90) return '#FFDD57';
      if (v < 120) return '#9CE22B';
      if (v < 150) return '#23CD5E';
      return '#008F43';
    }

    function getSpriteUrl(idStr) {
      const num = parseInt(idStr, 10);
      if (!isNaN(num) && num >= 1 && num <= 898) {
        return `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${num}.png`;
      }
      return 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/0.png';
    }

    function populateTypeFilter() {
      const sel = document.getElementById('typeFilter');
      Object.keys(TYPE_COLORS).forEach(t => {
        const opt = document.createElement('option');
        opt.value = t;
        opt.textContent = `Tipo: ${t}`;
        sel.appendChild(opt);
      });
    }

    function applyFilters() {
      const q = document.getElementById('searchInput').value.trim().toLowerCase();
      const typeVal = document.getElementById('typeFilter').value;
      const sortVal = document.getElementById('sortSelect').value;

      filteredPokemon = allPokemon.filter(p => {
        if (typeVal && p.t1 !== typeVal && p.t2 !== typeVal) return false;
        if (q) {
          return p.id.toLowerCase().includes(q) ||
            p.name.toLowerCase().includes(q) ||
            (p.nameEs && p.nameEs.toLowerCase().includes(q)) ||
            p.abilities.toLowerCase().includes(q);
        }
        return true;
      });

      const statIdx = { hp: 0, attack: 1, defense: 2, speed: 5 };
      filteredPokemon.sort((a, b) => {
        if (sortVal === 'id') return parseInt(a.id, 10) - parseInt(b.id, 10);
        if (sortVal === 'bst') return b.bst - a.bst;
        return b.stats[statIdx[sortVal]] - a.stats[statIdx[sortVal]];
      });

      document.getElementById('resultsCount').textContent = `${filteredPokemon.length} mostrados`;
      renderSidebar();
    }

    function renderSidebar() {
      const list = document.getElementById('pokemonList');
      list.innerHTML = filteredPokemon.map(p => {
        const active = p.id === selectedId ? 'active' : '';
        const t2 = p.t2 ? `<span class="mini-badge" style="background:${TYPE_COLORS[p.t2] || '#555'}">${p.t2}</span>` : '';
        return `
          <div class="poke-item ${active}" onclick="selectPokemon('${p.id}')">
            <img src="${getSpriteUrl(p.id)}" loading="lazy" alt="${p.name}" />
            <div class="poke-item-info">
              <div class="poke-item-top">
                <span class="poke-num">#${p.id}</span>
                <span class="poke-name">${p.nameEs || p.name}</span>
              </div>
              <div class="poke-item-types">
                <span class="mini-badge" style="background:${TYPE_COLORS[p.t1] || '#555'}">${p.t1}</span>
                ${t2}
              </div>
            </div>
            <span class="poke-bst-pill">${p.bst}</span>
          </div>
        `;
      }).join('');
    }

    function selectPokemon(id) {
      if (!allPokemon.some(x => x.id === id)) return;
      selectedId = id;
      renderSidebar();
      renderDetail();
      document.querySelector('.main').scrollTop = 0;
    }

    async function showAbilityInfo(btnEl, abilityText) {
      document.querySelectorAll('.ability-btn').forEach(b => b.classList.remove('selected'));
      btnEl.classList.add('selected');
      const panel = document.getElementById('abilityDescPanel');
      panel.classList.add('visible');
      panel.innerHTML = `<span style="color:var(--text-muted);">Cargando descripción de <strong>${abilityText}</strong>...</span>`;
      const info = await fetchAbilityDescription(abilityText);
      panel.innerHTML = `<strong style="color:var(--accent);">${info.name}:</strong> ${info.desc}`;
    }

    async function populateVisibleMoves(movesList) {
      const tbody = document.getElementById('movesTableBody');
      if (!tbody) return;

      for (let i = 0; i < movesList.length; i++) {
        const mv = movesList[i];
        const info = await fetchMoveDetails(mv.name);
        const row = document.getElementById(`move-row-${i}`);
        if (!row) continue;

        const catLabel = info.category === 'physical' ? 'Físico' : info.category === 'special' ? 'Especial' : 'Estado';
        const catClass = `cat-${info.category}`;

        row.innerHTML = `
          <td><span class="lvl-tag">${mv.req}</span></td>
          <td><strong>${mv.name}</strong></td>
          <td><span class="mini-badge" style="background:${TYPE_COLORS[info.type] || '#555'}">${info.type}</span></td>
          <td><span class="cat-pill ${catClass}">${catLabel}</span></td>
          <td><strong>${info.power}</strong></td>
          <td>${info.accuracy}</td>
          <td class="move-desc-cell">${info.desc}</td>
        `;
      }
    }

    function switchMoveTab(tabKey) {
      activeMoveTab = tabKey;
      renderDetail();
    }

    function renderDetail() {
      const container = document.getElementById('detailContainer');
      const p = allPokemon.find(x => x.id === selectedId) || filteredPokemon[0] || allPokemon[0];
      if (!p) return;

      const curIdx = filteredPokemon.findIndex(x => x.id === p.id);
      const prevPoke = curIdx > 0 ? filteredPokemon[curIdx - 1] : null;
      const nextPoke = (curIdx >= 0 && curIdx < filteredPokemon.length - 1) ? filteredPokemon[curIdx + 1] : null;

      const statLabels = ['HP', 'Ataque', 'Defensa', 'At. Esp.', 'Def. Esp.', 'Velocidad'];
      const statsHtml = p.stats.map((val, i) => {
        const pct = Math.min(100, Math.round((val / 255) * 100));
        return `
          <div class="stat-row">
            <span>${statLabels[i]}</span>
            <strong>${val}</strong>
            <div class="stat-track">
              <div class="stat-fill" style="width:${pct}%; background:${getStatColor(val)};"></div>
            </div>
          </div>
        `;
      }).join('');

      const abilitiesList = p.abilities ? p.abilities.split('|').map(a => a.trim()).filter(Boolean) : [];
      const abilitiesHtml = abilitiesList.length
        ? abilitiesList.map(ab => `<button class="ability-btn" onclick="showAbilityInfo(this, '${ab.replace(/'/g, "\\'")}')">✨ ${ab}</button>`).join('')
        : '<span style="color:var(--text-muted);">Sin habilidades registradas</span>';

      const evosHtml = p.evos.length
        ? p.evos.map(ev => {
            const rawStr = typeof ev === 'string' ? ev : ev.raw;
            const targetId = typeof ev === 'object' ? ev.targetId : null;
            const targetName = typeof ev === 'object' ? ev.targetName : rawStr;
            if (targetId) {
              return `
                <button class="evo-card-btn" onclick="selectPokemon('${targetId}')">
                  <div>
                    <div class="evo-target-name">→ ${targetName} (#${targetId})</div>
                    <div class="evo-cond">${rawStr}</div>
                  </div>
                  <span style="color:var(--accent); font-weight:700;">Ver ficha →</span>
                </button>
              `;
            }
            return `<div class="evo-card-btn" style="cursor:default;"><div class="evo-cond">${rawStr}</div></div>`;
          }).join('')
        : '<p style="color:var(--text-muted); font-size:0.85rem;">No tiene evoluciones posteriores.</p>';

      const moveCategories = [
        { key: 'level', label: `Por Nivel (${(p.moves.level || []).length})` },
        { key: 'tm', label: `MT / TMs (${(p.moves.tm || []).length})` },
        { key: 'tr', label: `DT / TRs (${(p.moves.tr || []).length})` },
        { key: 'egg', label: `Movimiento Huevo (${(p.moves.egg || []).length})` },
        { key: 'tutor', label: `Tutores (${(p.moves.tutor || []).length})` }
      ];

      const currentMoves = p.moves[activeMoveTab] || [];
      const movesSectionHtml = currentMoves.length
        ? `
          <table class="moves-table">
            <thead>
              <tr>
                <th style="width:85px;">Nivel / MT</th>
                <th>Movimiento</th>
                <th>Tipo</th>
                <th>Categoría</th>
                <th>Potencia</th>
                <th>Precisión</th>
                <th>Descripción / Efecto</th>
              </tr>
            </thead>
            <tbody id="movesTableBody">
              ${currentMoves.map((mv, idx) => `
                <tr id="move-row-${idx}">
                  <td><span class="lvl-tag">${mv.req}</span></td>
                  <td><strong>${mv.name}</strong></td>
                  <td colspan="5" style="color:var(--text-muted); font-size:0.8rem;">Cargando detalles...</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `
        : `<p style="color:var(--text-muted); font-size:0.88rem;">No hay movimientos registrados en esta sección.</p>`;

      container.innerHTML = `
        <div class="top-nav">
          <div class="top-nav-group">
            ${prevPoke ? `<button class="nav-btn" onclick="selectPokemon('${prevPoke.id}')">← #${prevPoke.id} ${prevPoke.name}</button>` : ''}
            <a href="entrenadores.html" class="nav-btn nav-btn-trainers">⚔️ Entrenadores</a>
          </div>
          <div class="top-nav-group">
            ${nextPoke ? `<button class="nav-btn" onclick="selectPokemon('${nextPoke.id}')">#${nextPoke.id} ${nextPoke.name} →</button>` : ''}
          </div>
        </div>

        <section class="hero-card">
          <div class="sprite-box"><img src="${getSpriteUrl(p.id)}" alt="${p.name}" /></div>
          <div style="flex:1;">
            <span style="color:var(--text-muted); font-size:0.85rem;">N.º Interno #${p.id}${p.nameEs ? ` · Registro: ${p.name}` : ''}</span>
            <h2 class="hero-title">${p.nameEs || p.name}</h2>
            <div class="type-row">
              <span class="type-badge" style="background:${TYPE_COLORS[p.t1] || '#555'}">${p.t1}</span>
              ${p.t2 ? `<span class="type-badge" style="background:${TYPE_COLORS[p.t2] || '#555'}">${p.t2}</span>` : ''}
            </div>
            <div style="font-size:0.78rem; color:var(--text-muted); margin-bottom:6px;">Haz clic en una habilidad para ver su descripción:</div>
            <div class="abilities-box">${abilitiesHtml}</div>
            <div id="abilityDescPanel" class="ability-desc-panel"></div>
          </div>
        </section>

        <div class="two-col">
          <section class="card">
            <div class="card-title"><span>Estadísticas Base</span><span>Total: ${p.bst}</span></div>
            ${statsHtml}
            <div class="bst-footer"><span>Suma Total (BST)</span><span>${p.bst}</span></div>
          </section>

          <section class="card">
            <div class="card-title"><span>Biología y Evoluciones</span></div>
            <div class="info-grid">
              <div class="info-cell"><span>Altura</span><strong>${p.height}</strong></div>
              <div class="info-cell"><span>Peso</span><strong>${p.weight}</strong></div>
              <div class="info-cell"><span>Color</span><strong>${p.color}</strong></div>
              <div class="info-cell"><span>ID Interno</span><strong>#${p.id}</strong></div>
            </div>
            <div class="card-title" style="margin-top:16px;"><span>Cadena Evolutiva (clic para ir)</span></div>
            <div class="evo-list">${evosHtml}</div>
          </section>
        </div>

        <section class="card">
          <div class="card-title"><span>Movimientos que aprende</span></div>
          <div class="tabs-bar">
            ${moveCategories.map(c => `<button class="tab-btn ${activeMoveTab === c.key ? 'active' : ''}" onclick="switchMoveTab('${c.key}')">${c.label}</button>`).join('')}
          </div>
          <div style="overflow-x:auto;">${movesSectionHtml}</div>
        </section>
      `;

      if (currentMoves.length) {
        populateVisibleMoves(currentMoves);
      }
    }

    document.addEventListener('keydown', (e) => {
      if (['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
      const curIdx = filteredPokemon.findIndex(x => x.id === selectedId);
      if (e.key === 'ArrowLeft' && curIdx > 0) {
        selectPokemon(filteredPokemon[curIdx - 1].id);
      } else if (e.key === 'ArrowRight' && curIdx >= 0 && curIdx < filteredPokemon.length - 1) {
        selectPokemon(filteredPokemon[curIdx + 1].id);
      }
    });

    async function init() {
      populateTypeFilter();
      let rawData = null;
      for (const file of ['pokedex_full.json', 'pokedex_compact.json']) {
        try {
          const res = await fetch(file);
          if (res.ok) {
            rawData = await res.json();
            break;
          }
        } catch {}
      }

      if (!rawData) {
        document.getElementById('detailContainer').innerHTML = `
          <div class="top-nav">
            <a href="entrenadores.html" class="nav-btn nav-btn-trainers">⚔️ Ir a Entrenadores</a>
          </div>
          <div class="card">
            <h3 style="color:#f87171;">No se pudo cargar pokedex_full.json</h3>
            <p style="color:var(--text-muted); margin-top:8px;">Abre la carpeta mediante un servidor local (<code>python -m http.server 8000</code>) y entra en <code>http://localhost:8000</code>.</p>
          </div>`;
        return;
      }

      const list = Array.isArray(rawData) ? rawData : (rawData.pokemon || []);
      allPokemon = list.map(normalizeEntry);
      selectedId = allPokemon[0] ? allPokemon[0].id : '001';
      document.getElementById('totalBadge').textContent = allPokemon.length;

      document.getElementById('searchInput').addEventListener('input', applyFilters);
      document.getElementById('typeFilter').addEventListener('change', applyFilters);
      document.getElementById('sortSelect').addEventListener('change', applyFilters);

      applyFilters();
      renderDetail();
    }

    init();
  </script>
</body>
</html>
